name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"          # nightly rebuild to refresh visit stats (07:17 UTC)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # jekyll-seo-tag / last-modified need history

      # Ruby version: .ruby-version (setup-ruby's default source).
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v6

      # Node is preinstalled on the runner; scripts/test-*.mjs use node:test.
      - name: Unit tests
        run: node --test scripts/test-*.mjs

      # Visit stats for the Stats app (assets/data/stats.json, git-ignored).
      # A GoatCounter outage or missing token must never block a deploy: the
      # script reports problems as warnings on the run and, if the API fails,
      # redeploys the snapshot the live site already serves.
      - name: Fetch visit stats
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          STATS_FALLBACK_URL: ${{ steps.pages.outputs.base_url }}/assets/data/stats.json
        run: node scripts/fetch-stats.mjs echoness

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --trace

      - name: HTML sanity check
        run: |
          test -f _site/index.html
          test -f _site/assets/data/content.json
          test -f _site/404.html
          test -f _site/feed.xml
          ls _site/assets/vendor/mermaid/*/mermaid.esm.min.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
