<text x="550" y="23" fill="#6f86ab" text-anchor="middle" style="font-size:13px">aegis — scripts/cli-tour.sh</text>
<g class="l0"><text x="24" y="64" fill="#ff7a2e">$</text><text x="40.9" y="64" fill="#e6edf3" xml:space="preserve">aegis plugin list --group aegis.packs</text><rect class="t0" transform="translate(341.54999999999995 0)" x="40.9" y="48" width="341.54999999999995" height="22" fill="#0b1220"/></g>
<text class="l1" x="24" y="87" fill="#5f7190" xml:space="preserve">  Name                  Package                                Version</text>
<text class="l2" x="24" y="110" fill="#9fb0c8" xml:space="preserve">  aegis.budgets         aegis-gateway-pack-budgets             2.0.0a5</text>
<text class="l3" x="24" y="133" fill="#9fb0c8" xml:space="preserve">  aegis.classification  aegis-gateway-pack-classification      2.0.0a5</text>
<text class="l4" x="24" y="156" fill="#67e8f9" xml:space="preserve">  aegis.content         aegis-gateway-pack-content             2.0.0a5</text>
<text class="l5" x="24" y="179" fill="#9fb0c8" xml:space="preserve">  aegis.pii             aegis-gateway-pack-pii                 2.0.0a5</text>
<text class="l6" x="24" y="202" fill="#67e8f9" xml:space="preserve">  aegis.policy          aegis-gateway-pack-classification      2.0.0a5</text>
<text class="l7" x="24" y="225" fill="#9fb0c8" xml:space="preserve">  aegis.residency       aegis-gateway-pack-residency           2.0.0a5</text>
<g class="l9"><text x="24" y="271" fill="#ff7a2e">$</text><text x="40.9" y="271" fill="#e6edf3" xml:space="preserve">aegis runs create "Why is api_key: 8f14e45fceea167a5a36dedd4bea2543 rejected?" --route default</text><rect class="t9" transform="translate(823.1999999999999 0)" x="40.9" y="255" width="823.1999999999999" height="22" fill="#0b1220"/></g>
<text class="l10" x="24" y="294" fill="#9fb0c8" xml:space="preserve">run_id: 19b3e7e5-7017-4c7e-9732-497a378831ce</text>
<text class="l11" x="24" y="317" fill="#f87171" xml:space="preserve">status: blocked</text>
<g class="l12"><text x="24" y="340" fill="#ff7a2e">$</text><text x="40.9" y="340" fill="#e6edf3" xml:space="preserve">aegis runs create "What is our refund policy?" --route underwriting</text><rect class="t12" transform="translate(595.05 0)" x="40.9" y="324" width="595.05" height="22" fill="#0b1220"/></g>
<text class="l13" x="24" y="363" fill="#4ade80" xml:space="preserve">status: completed   response: Risk: low.</text>
<g class="l14"><text x="24" y="386" fill="#ff7a2e">$</text><text x="40.9" y="386" fill="#e6edf3" xml:space="preserve">aegis runs create "Applicant SIN 046-454-286, assess risk" --route underwriting --approver jane</text><rect class="t14" transform="translate(831.65 0)" x="40.9" y="370" width="831.65" height="22" fill="#0b1220"/></g>
<text class="l15" x="24" y="409" fill="#9fb0c8" xml:space="preserve">run_id: 83a0c623-103a-4e8e-8177-9ae2a5cc5175</text>
<text class="l16" x="24" y="432" fill="#fbbf24" xml:space="preserve">status: paused</text>
<g class="l17"><text x="24" y="455" fill="#ff7a2e">$</text><text x="40.9" y="455" fill="#e6edf3" xml:space="preserve">AEGIS_API_KEY=$JANE_KEY aegis runs deny 83a0c623-103a-4e8e-8177-9ae2a5cc5175</text><rect class="t17" transform="translate(671.0999999999999 0)" x="40.9" y="439" width="671.0999999999999" height="22" fill="#0b1220"/></g>
<text class="l18" x="24" y="478" fill="#9fb0c8" xml:space="preserve">Run 83a0c623-103a-4e8e-8177-9ae2a5cc5175 denied: status=denied</text>
<g class="l20"><text x="24" y="524" fill="#ff7a2e">$</text><text x="40.9" y="524" fill="#e6edf3" xml:space="preserve">aegis explain 83a0c623-103a-4e8e-8177-9ae2a5cc5175</text><rect class="t20" transform="translate(451.4 0)" x="40.9" y="508" width="451.4" height="22" fill="#0b1220"/></g>
<text class="l21" x="24" y="547" fill="#e6edf3" xml:space="preserve">run 83a0c623  route=underwriting  principal=svc-underwriting  status=denied</text>
<text class="l22" x="24" y="570" fill="#5f7190" xml:space="preserve">config=sha256:3fc4c49815668ae0b7364b246258f4904762966ea2ff5a24f56ff12efde7a521</text>
<line class="l23" x1="24" x2="1076" y1="588" y2="588" stroke="#2a3a55" stroke-dasharray="2 3"/>
<text class="l24" x="24" y="616" fill="#4ade80" xml:space="preserve">  guard         no_secrets                ALLOW</text>
<text class="l25" x="24" y="639" fill="#67e8f9" xml:space="preserve">  ingress       pii.mask                  SANITIZE  reason=masked 1 CA_SIN — the model sees placeholders, never the values</text>
<text class="l26" x="24" y="662" fill="#fbbf24" xml:space="preserve">  guard         residency_ca              REQUIRE_APPROVAL  reason=residency: region 'us-east-1' for route</text>
<text class="l27" x="24" y="685" fill="#fbbf24" xml:space="preserve">                                          'underwriting' is not in the allowed set ['ca-central-1']</text>
<text class="l28" x="24" y="708" fill="#f87171" xml:space="preserve">  ingress       residency_ca              DENIED  reason=run denied by reviewer</text>
<line class="l29" x1="24" x2="1076" y1="726" y2="726" stroke="#2a3a55" stroke-dasharray="2 3"/>
<text class="l30" x="24" y="754" fill="#5f7190" xml:space="preserve">  short-circuited at ingress/residency_ca · provider never called</text>
<g class="l32"><text x="24" y="800" fill="#ff7a2e">$</text><text x="40.9" y="800" fill="#e6edf3" xml:space="preserve">aegis audit export -o ledger.jsonl &amp;&amp; aegis audit verify ledger.jsonl</text><rect class="t32" transform="translate(611.9499999999999 0)" x="40.9" y="784" width="611.9499999999999" height="22" fill="#0b1220"/></g>
<text class="l33" x="24" y="823" fill="#9fb0c8" xml:space="preserve">Exported 6 record(s) to ledger.jsonl</text>
<text class="l34" x="24" y="846" fill="#4ade80" xml:space="preserve">OK  6 record(s) verified — chain is intact.</text>
