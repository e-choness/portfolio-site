<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Aegis</title>
  <desc id="d">Aegis — a self-hosted AI gateway. Guardrails return allow, sanitize, block or require_approval, and every verdict lands in a hash-chained ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="1" stop-color="#0e1b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner" cx="1" cy="0" r="0.8">
      <stop offset="0" stop-color="#ff7a2e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="0.5" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#f2551d"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b1a36" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <clipPath id="shieldClip">
      <path d="M200 70 L292 104 V186 C292 250 252 290 200 312 C148 290 108 250 108 186 V104 Z"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }

    .draw { stroke-dasharray: 760; stroke-dashoffset: 0; animation: draw 9s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 760; } 18% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }

    .pulse { transform-origin: 200px 190px; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

    .scan { animation: scan 4.5s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(260px); } }

    .node { animation: node 6s ease-out infinite; }
    @keyframes node { 0% { opacity: 1; } 12% { opacity: 1; } 30% { opacity: .25; } 100% { opacity: .25; } }
    .n0 { animation-delay: 0s; } .n1 { animation-delay: 1s; } .n2 { animation-delay: 2s; }
    .n3 { animation-delay: 3s; } .n4 { animation-delay: 4s; } .n5 { animation-delay: 5s; }

    .pill { animation: pill 12s ease-in-out infinite; }
    @keyframes pill { 0%,100% { opacity: .55; } 4%,21% { opacity: 1; } 25% { opacity: .55; } }
    .p0 { animation-delay: 0s; } .p1 { animation-delay: 3s; } .p2 { animation-delay: 6s; } .p3 { animation-delay: 9s; }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .twinkle { animation: tw 5s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#corner)"/>

  <g fill="#60a5fa">
    <circle class="twinkle" cx="520" cy="70" r="1.6" style="animation-delay:.4s"/>
    <circle class="twinkle" cx="760" cy="120" r="1.2" style="animation-delay:1.7s"/>
    <circle class="twinkle" cx="1010" cy="60" r="1.8" style="animation-delay:2.9s"/>
    <circle class="twinkle" cx="1190" cy="190" r="1.3" style="animation-delay:.9s"/>
    <circle class="twinkle" cx="1215" cy="430" r="1.5" style="animation-delay:3.6s"/>
    <circle class="twinkle" cx="70" cy="470" r="1.4" style="animation-delay:2.2s"/>
    <circle class="twinkle" cx="90" cy="90" r="1.1" style="animation-delay:4.1s"/>
  </g>

  <!-- shield, scaled from the wide banner's geometry -->
  <g transform="translate(265 270) scale(1.45) translate(-200 -190)">
    <circle cx="200" cy="190" r="170" fill="url(#glow)" class="pulse"/>
    <path d="M200 70 L292 104 V186 C292 250 252 290 200 312 C148 290 108 250 108 186 V104 Z" fill="url(#shieldFill)"/>
    <g clip-path="url(#shieldClip)">
      <path d="M200 70 V312 M108 180 H292" stroke="#3b82f6" stroke-width="1.2" opacity=".45"/>
      <g stroke="#1e40af" stroke-width="1" opacity=".5" fill="none">
        <path d="M128 130 H170 V150 H185"/><path d="M230 128 H262 V160"/>
        <path d="M135 220 H168 V250"/><path d="M226 214 H270 M246 214 V262"/>
      </g>
      <rect class="scan" x="100" y="60" width="200" height="16" fill="url(#sweep)" opacity=".55"/>
    </g>
    <path class="draw" d="M200 70 L292 104 V186 C292 250 252 290 200 312 C148 290 108 250 108 186 V104 Z" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linejoin="round"/>
    <path d="M200 92 L272 118 V186 C272 238 240 270 200 288 C160 270 128 238 128 186 V118 Z" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity=".6"/>
    <path d="M186 124 L214 124 L200 148 Z" fill="#ff7a2e"/>
    <circle cx="200" cy="190" r="9" fill="#dbeafe" class="pulse"/>
  </g>

  <!-- wordmark -->
  <path id="wordmark" aria-label="AEGIS" d="M559.70 125.20Q574.25 125.20 585.05 130.90Q595.85 136.60 601.85 147.70Q607.85 158.80 607.85 174.55L607.85 232L583.55 232L583.55 206.80L535.55 206.80L535.55 232L511.55 232L511.55 174.55Q511.55 158.80 517.55 147.70Q523.55 136.60 534.35 130.90Q545.15 125.20 559.70 125.20M535.55 187.30L583.55 187.30L583.55 172.30Q583.55 159.25 577.10 152.57Q570.65 145.90 559.55 145.90Q548.30 145.90 541.92 152.57Q535.55 159.25 535.55 172.30M718.15 204.70L725.65 223Q718.15 228.10 706.82 230.95Q695.50 233.80 682.75 233.80Q666.85 233.80 655.75 229.82Q644.65 225.85 638.95 218.72Q633.25 211.60 633.25 202.45Q633.25 194.05 637.90 187.60Q642.55 181.15 650.65 178Q644.50 174.70 641.13 169Q637.75 163.30 637.75 156.25Q637.75 147.70 643 140.65Q648.25 133.60 658.90 129.40Q669.55 125.20 685 125.20Q695.20 125.20 704.95 127.23Q714.70 129.25 721.90 132.70L715.15 151.30Q701.35 144.85 685.90 144.85Q674.20 144.85 668.27 148.38Q662.35 151.90 662.35 157.90Q662.35 163.45 666.32 166.38Q670.30 169.30 678.40 169.30L707.05 169.30L707.05 188.50L676.90 188.50Q667.75 188.50 662.80 191.65Q657.85 194.80 657.85 200.80Q657.85 207.10 664.23 210.63Q670.60 214.15 683.80 214.15Q693.10 214.15 702.40 211.68Q711.70 209.20 718.15 204.70M818.85 206.35L818.85 177.85L841.05 177.85L841.05 232L822.75 232L822.75 225.70Q811.80 233.80 794.55 233.80Q780 233.80 767.85 227.50Q755.70 221.20 748.50 209.13Q741.30 197.05 741.30 180.40Q741.30 164.35 748.72 151.82Q756.15 139.30 769.35 132.25Q782.55 125.20 799.05 125.20Q812.85 125.20 824.10 129.85Q835.35 134.50 843 143.35L827.40 157.75Q816.15 145.90 800.25 145.90Q790.20 145.90 782.40 150.18Q774.60 154.45 770.25 162.25Q765.90 170.05 765.90 180.25Q765.90 190.90 770.17 198.40Q774.45 205.90 781.65 209.72Q788.85 213.55 797.40 213.55Q810.15 213.55 818.85 206.35M925.70 146.50L907.55 146.50L907.55 212.50L925.70 212.50L925.70 232L864.95 232L864.95 212.50L883.25 212.50L883.25 146.50L864.95 146.50L864.95 127L925.70 127M986.50 233.80Q974.05 233.80 962.42 230.43Q950.80 227.05 943.75 221.65L952 203.35Q958.75 208.30 968.05 211.30Q977.35 214.30 986.65 214.30Q997 214.30 1001.95 211.22Q1006.90 208.15 1006.90 203.05Q1006.90 199.30 1003.97 196.82Q1001.05 194.35 996.47 192.85Q991.90 191.35 984.10 189.55Q972.10 186.70 964.45 183.85Q956.80 181 951.32 174.70Q945.85 168.40 945.85 157.90Q945.85 148.75 950.80 141.32Q955.75 133.90 965.72 129.55Q975.70 125.20 990.10 125.20Q1000.15 125.20 1009.75 127.60Q1019.35 130 1026.55 134.50L1019.05 152.95Q1004.50 144.70 989.95 144.70Q979.75 144.70 974.88 148Q970 151.30 970 156.70Q970 162.10 975.63 164.73Q981.25 167.35 992.80 169.90Q1004.80 172.75 1012.45 175.60Q1020.10 178.45 1025.58 184.60Q1031.05 190.75 1031.05 201.25Q1031.05 210.25 1026.02 217.68Q1021 225.10 1010.95 229.45Q1000.90 233.80 986.50 233.80" fill="url(#word)"/>
  <text x="506" y="292" class="sans" font-size="32" fill="#c9d5ea">The self-hosted AI gateway</text>
  <text x="506" y="334" class="sans" font-size="32" fill="#c9d5ea">that shows its work.</text>
  <text x="506" y="378" class="mono" font-size="17" fill="#6f86ab">pip install aegis-gateway<tspan class="caret" fill="#ff7a2e"> ▍</tspan></text>

  <!-- the four verdicts -->
  <g class="mono" font-size="15" text-anchor="middle">
    <g class="pill p0"><rect x="506" y="404" width="118" height="34" rx="17" fill="#052e1c" stroke="#22c55e"/><text x="565" y="426" fill="#4ade80">allow</text></g>
    <g class="pill p1"><rect x="636" y="404" width="136" height="34" rx="17" fill="#0b2447" stroke="#60a5fa"/><text x="704" y="426" fill="#93c5fd">sanitize</text></g>
    <g class="pill p2"><rect x="784" y="404" width="118" height="34" rx="17" fill="#3a0d0d" stroke="#ef4444"/><text x="843" y="426" fill="#f87171">block</text></g>
    <g class="pill p3"><rect x="914" y="404" width="210" height="34" rx="17" fill="#3a2605" stroke="#f59e0b"/><text x="1019" y="426" fill="#fbbf24">require_approval</text></g>
  </g>

  <!-- pipeline strip -->
  <g transform="translate(0 548)">
    <path d="M140 0 H1140" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M140 0 H1140" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 10" opacity=".6">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/>
    </path>
    <g fill="#0e1b33" stroke="#3b82f6" stroke-width="2">
      <circle cx="140" cy="0" r="8"/><circle cx="340" cy="0" r="8"/><circle cx="540" cy="0" r="8"/>
      <circle cx="740" cy="0" r="8"/><circle cx="940" cy="0" r="8"/><circle cx="1140" cy="0" r="8"/>
    </g>
    <g fill="#93c5fd">
      <circle class="node n0" cx="140" cy="0" r="4.5"/><circle class="node n1" cx="340" cy="0" r="4.5"/>
      <circle class="node n2" cx="540" cy="0" r="4.5"/><circle class="node n3" cx="740" cy="0" r="4.5"/>
      <circle class="node n4" cx="940" cy="0" r="4.5"/><circle class="node n5" cx="1140" cy="0" r="4.5" fill="#ff7a2e"/>
    </g>
    <g class="mono" font-size="15" fill="#8da2c4" text-anchor="middle">
      <text x="140" y="34">request</text><text x="340" y="34">ingress</text><text x="540" y="34">route</text>
      <text x="740" y="34">execute</text><text x="940" y="34">egress</text><text x="1140" y="34" fill="#ffb070">ledger</text>
    </g>
    <circle r="7" fill="#ff7a2e" cx="140" cy="0">
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.84;1" calcMode="linear" path="M0 0 H1000"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.84;0.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
