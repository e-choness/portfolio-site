# The solar system, as the Orrery draws it (assets/js/games/orrery.js).
#
# Physical figures are from the NASA planetary fact sheet and are real.
# SCREEN figures are not, and cannot be: at true scale with Earth one pixel
# wide, Neptune would sit 2.5 metres off the side of the canvas. These are
# hand-tuned to keep the ordering and the size story readable.
#
#   orbit   orbit radius on the map, px          size   disc radius on the map, px
#   zr      sphere radius when zoomed in, px     period orbital period, Earth days
#   tilt    axial tilt, degrees — PAST 90 MEANS RETROGRADE, and the renderer
#           takes the rotation direction from this, so do not also negate rot
#   rot     sidereal rotation period, hours      tex    surface generator
#   tint    darkest surface colour, RGB          tint2  lightest, RGB
#   a/ecc/arg   comet orbit: semi-major axis px, eccentricity, orientation deg
#   moons   d = orbit radius px, r = disc radius px, p = period in days
#   rings   [inner, outer, opacity] in planet radii
#
# Consumed as /assets/data/solar.json, which is emitted from this file.

