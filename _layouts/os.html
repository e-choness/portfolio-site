<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Before first paint: mark JS as on and apply the saved theme and accent
    // (the same keys store.js persists), so the OS never flashes the default.
    document.documentElement.classList.add('js');
    try {
      var t = localStorage.getItem('echoos-theme');
      document.documentElement.dataset.echoTheme = t === 'dark' ? 'dark' : 'light';
      var a = localStorage.getItem('echoos-accent');
      if (a) document.documentElement.style.setProperty('--accent', a);
    } catch (e) { document.documentElement.dataset.echoTheme = 'light'; }
  </script>
  {% include head.html %}
  <title>{{ page.title | default: site.title }}</title>
  {% if page.notfound %}<meta name="robots" content="noindex" />{% endif %}

  <link rel="manifest" href="{{ '/assets/manifest.webmanifest' | relative_url }}" />
  <link rel="apple-touch-icon" href="{{ '/assets/images/icons/app-192.png' | relative_url }}" />
  <meta name="theme-color" content="#e8e4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11111b" media="(prefers-color-scheme: dark)" />

  <!-- Self-hosted fonts (_sass/base/_fonts.scss): preload the latin Gothic A1 weights most text uses -->
  {%- assign font_weights = "400,600,800" | split: "," %}
  {%- for w in font_weights %}
  <link rel="preload" href="{{ '/assets/fonts/gothic-a1-' | append: w | append: '-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
  {%- endfor %}

  <link href="{{ '/assets/css/os.css' | relative_url }}?v={{ site.asset_version }}" rel="stylesheet" />
  {% include static-style.html %}
  <style>
    html.js #echoos-static { display: none; }
    html:not(.js) #echoos-root { display: none; } /* the empty, fixed wallpaper would cover the summary */
  </style>
</head>
<body>
  <div id="echoos-root" data-base="{{ site.baseurl }}" data-content="{{ '/assets/data/content.json' | relative_url }}?v={{ site.time | date: '%s' }}"{% if page.notfound %} data-notfound="true"{% endif %}{% if site.goatcounter != "" and site.goatcounter %} data-goatcounter="{{ site.goatcounter }}"{% endif %}></div>

  {% include static-summary.html %}

  {% include importmap.html %}
  <script src="{{ '/assets/js/games.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
  <script type="module" src="{{ '/assets/js/echoos/boot.js' | relative_url }}?v={{ site.asset_version }}"></script>
</body>
</html>
