# Site settings. Who the site is about (title, description, author, email,
# social links) comes from _data/profile.yml via _plugins/profile_config.rb.
baseurl: "/portfolio-site" # the subpath of your site, e.g. /blog
repository: e-choness/portfolio-site
url: "https://e-choness.github.io" # hostname + protocol; baseurl is the subpath

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - NOTES.md
  - IMPLEMENTATION-PLAN.md
  - PATCH-1.md
  - Dockerfile
  - docker-compose.yml
  - node_modules
  - vendor/
  - docs/
  - .github/

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
# Posts and projects are read inside the OS (Blog / Projects windows). Their
# own URLs are redirect stubs (_layouts/redirect.html), kept out of the sitemap.
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: redirect, sitemap: false }
  - scope: { path: "", type: "projects" }
    values: { layout: redirect, sitemap: false }

# Theme settings
sass:
  style: compressed
  load_paths:
    - _sass
  quiet_deps: true