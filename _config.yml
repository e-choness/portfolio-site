# Site settings
title: Echo Yin
email: echoybl1123@gmail.com
description: >-
  Full-stack developer passionate about creating innovative web solutions.
  Experienced in modern JavaScript frameworks, backend development, and UI/UX design.
baseurl: "/portfolio-site" # the subpath of your site, e.g. /blog
repository: e-choness/portfolio-site # Change to <your-username>/<your-username>.github.io (or remove it if you don't need remote projects) # the base hostname & protocol for your site
url: "https://e-choness.github.io" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - NOTES.md
  - IMPLEMENTATION-PLAN.md
  - Dockerfile
  - docker-compose.yml
  - node_modules
  - vendor/

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: post }
  - scope: { path: "", type: "projects" }
    values: { layout: project }

# Blog settings
blog:
  title: "Blog"
  description: "Thoughts on web development, technology, and career insights"
  author: "Echo Yin"

projects:
  title: "Projects"
  description: "Explore my portfolio of projects showcasing various technologies and skills"
  author: "Echo Yin"

# Site data
author:
  name: Echo Yin
  title: Software Engineer
  location: "Edmonton, AB, Canada"
  years_experience: 5
  projects_completed: 25
  happy_clients: 15

# Social links
social:
  github: e-choness
  linkedin: echoybl0451
  twitter: _echo_yin
  email: echoybl1123@gmail.com

# Theme settings
sass:
  style: compressed
  load_paths:
    - _scss
  quiet_deps: true