# `docker compose up` serves the site at http://localhost:4000 with live reload
# (the image's CMD: jekyll serve with _config_dev.yml). One-off tasks reuse the
# same service, e.g. `docker compose run --rm jekyll node --test scripts/`.
services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
